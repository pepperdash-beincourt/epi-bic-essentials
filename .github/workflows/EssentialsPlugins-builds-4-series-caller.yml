name: Build PepperDash Essentials

on:
  push:
    branches:
      - '**'

jobs:
  runTests:
    uses: PepperDash/workflow-templates/.github/workflows/essentialsplugins-run-tests.yml@main
    secrets: inherit
  getVersion:
    uses: PepperDash/workflow-templates/.github/workflows/essentialsplugins-getversion.yml@main
    secrets: inherit
    needs: runTests
  build-4Series:
    uses: PepperDash/workflow-templates/.github/workflows/essentialsplugins-4Series-builds.yml@main
    secrets: inherit
    needs: getVersion
    if: needs.getVersion.outputs.newVersion == 'true'
    with:
      newVersion: ${{ needs.getVersion.outputs.newVersion }}
      version: ${{ needs.getVersion.outputs.version }}
      tag: ${{ needs.getVersion.outputs.tag }}
      channel: ${{ needs.getVersion.outputs.channel }}
      bypassPackageCheck: true
      # Requires the ESSENTIALSDEVTOOLSVERSION repo variable (Settings > Secrets and variables >
      # Actions > Variables) to be set to a real PepperDash/essentials-devtools release tag, e.g.
      # "v1.5.0". Forks don't inherit repo variables from upstream, so this is empty by default on a
      # fresh fork - when empty, the reusable workflow silently skips both downloading AND embedding
      # the devtools SPA (no error), which shows up at runtime as https://<processor>/cws/debug 404ing
      # while the rest of the Essentials Web API works fine.
      devToolsVersion: ${{ vars.ESSENTIALSDEVTOOLSVERSION }}